// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.7.22'
    repositories {
        google()
        mavenCentral()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.2'
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.7.22',
                'org.jetbrains.kotlin:kotlin-stdlib-common:1.7.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.22'
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    repositories {
        google()
        mavenCentral()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    configuration = [
            package          : "com.momentolabs.app.security.applocker",
            compileSdkVersion: 34,
            targetSdkVersion : 34,
            minSdkVersion    : 17,
            devMinSdkVersion : 23,
            versionCode      : 37,
            versionName      : "1.5.5"
    ]
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
